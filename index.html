    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg-color: #fff0f3;
            --primary-color: #ff4d6d;
            --accent-color: #c9184a;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            overflow-x: hidden;
        }

        /* Lock Screen */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }

        #lock-screen h2 { font-size: 2.2rem; margin-bottom: 10px; }
        #lock-screen input {
            padding: 14px 22px;
            font-size: 1.1rem;
            border-radius: 30px;
            border: none;
            outline: none;
            text-align: center;
            width: 85%;
            max-width: 320px;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #333;
        }
        #lock-screen button {
            padding: 12px 30px;
            background: white;
            color: var(--primary-color);
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Main Content */
        #main-content {
            display: none;
            padding: 20px 15px;
            max-width: 650px;
            margin: 0 auto;
        }

        .section {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px 20px;
            margin: 35px 0;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.15);
            border: 1px solid #ffccd5;
        }

        h1, h2 { color: var(--accent-color); }

        .sticker-header { font-size: 3rem; margin-bottom: 10px; }

        .shayari-box {
            background: #fff5f7;
            border-left: 4px solid var(--primary-color);
            padding: 18px;
            margin: 20px 0;
            font-style: italic;
            font-size: 1.1rem;
            line-height: 1.8;
            border-radius: 0 15px 15px 0;
            color: #555;
        }

        .letter-body {
            text-align: left;
            line-height: 1.8;
            font-size: 1.05rem;
            background: #fff9fa;
            padding: 20px;
            border-radius: 15px;
            border: 1px dashed #ffb3c1;
            color: #444;
        }

        /* Photo Frame */
        .photo-frame {
            width: 100%;
            max-width: 320px;
            margin: 15px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid var(--primary-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .photo-frame img {
            width: 100%;
            height: auto;
            display: block;
        }

            width: 100%;
            max-width: 300px;

            overflow: hidden;
            border: 3px solid var(--primary-color);
            background: #000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
